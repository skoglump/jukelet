[project]
name = "jukelet"
version = "0.1.0rc1"
description = "Jukelet tag-to-music manager"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = [
  "httpx>=0.28,<1",
  "websockets>=16,<17",
  "fastapi==0.143.2",
  "uvicorn>=0.38,<1",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukelet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["jukelet"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

# The separately distributed HA package has its own explicit companion-check.
# App integration tests import its dependency-free Bridge, not HA runtime modules.
[[tool.mypy.overrides]]
module = ["companion.*"]
follow_imports = "skip"
