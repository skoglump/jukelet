[project]
name = "jukelet"
version = "0.1.0"
description = "Jukelet application foundation"
requires-python = "==3.14.*"
dependencies = [
  "fastapi==0.143.2",
  "uvicorn>=0.38,<1",
  "sqlalchemy==2.1.4",
  "alembic==1.20.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukelet"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["jukelet"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
