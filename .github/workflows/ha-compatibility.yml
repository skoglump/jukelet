name: HA compatibility

on:
  pull_request:
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      integration_ref:
        description: 'Reviewed immutable integration commit/tag; empty uses last runtime/package change'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ha-compatibility-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.9'
      - name: Discover current stable and upcoming monthly beta
        id: discover
        run: |
          mkdir -p compatibility
          python -m scripts.ha_compatibility discover --output compatibility/discovery.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('compatibility/discovery.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'version': result['targets']}) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Discovered HA matrix\n\n' + json.dumps(result, indent=2) + '\n\n')
              summary.write('Absent beta = not available, never a passing beta test.\n')
          PY
      - name: Reproduce one immutable archive for the whole matrix
        env:
          REQUESTED_REF: ${{ inputs.integration_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            source_ref="$GITHUB_SHA"
          elif [ -n "$REQUESTED_REF" ]; then
            source_ref="$REQUESTED_REF"
          else
            source_ref="$(git log -1 --format=%H -- companion/custom_components/jukelet_bridge scripts/package_integration.py LICENSE)"
          fi
          source_commit="$(git rev-parse --verify --end-of-options "${source_ref}^{commit}")"
          printf '%s\n' "$source_commit" > compatibility/archive-source.txt
          # Use the reviewed builder from that immutable source, not a later allowlist.
          git show "$source_commit:scripts/package_integration.py" > "$RUNNER_TEMP/package_integration.py"
          python "$RUNNER_TEMP/package_integration.py" --ref "$source_commit" --output compatibility/archive
          for archive in compatibility/archive/*.zip; do
            python "$RUNNER_TEMP/package_integration.py" --verify "$archive"
          done
          {
            echo '## Immutable archive identity'
            cat compatibility/archive-source.txt
            cat compatibility/archive/*.sha256
            echo 'Archive source and current probe source are recorded separately.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ha-compatibility-input
          path: compatibility/
          retention-days: 90
          if-no-files-found: error

  isolated-core:
    needs: discover-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-and-package.outputs.matrix) }}
    env:
      HA_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.9'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ha-compatibility-input
          path: compatibility/input
      - name: Install app and exact upstream HA environments
        run: |
          python -m pip install uv==0.13.5
          uv sync --project backend --locked
          mkdir -p compatibility/results
          python -m scripts.ha_compatibility prepare --version 2026.10.3 --root "$RUNNER_TEMP/ha-baseline" > compatibility/results/prepare-baseline.log 2>&1
          cp "$RUNNER_TEMP/ha-baseline/"environment.json "$RUNNER_TEMP/ha-baseline/"requirements.txt compatibility/results/
          if [ "$HA_VERSION" = 2026.10.3 ]; then
            echo "HA_PYTHON=$RUNNER_TEMP/ha-baseline/venv/bin/python" >> "$GITHUB_ENV"
          else
            python -m scripts.ha_compatibility prepare --version "$HA_VERSION" --root "$RUNNER_TEMP/ha-selected" > compatibility/results/prepare-selected.log 2>&1
            cp "$RUNNER_TEMP/ha-selected/environment.json" compatibility/results/selected-environment.json
            cp "$RUNNER_TEMP/ha-selected/requirements.txt" compatibility/results/selected-requirements.txt
            echo "HA_PYTHON=$RUNNER_TEMP/ha-selected/venv/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Actual isolated archive install, Core upgrade and regression probes
        run: |
          archive="$(find compatibility/input/archive -maxdepth 1 -name '*.zip')"
          python -m scripts.ha_compatibility run --python "$HA_PYTHON" --baseline-python "$RUNNER_TEMP/ha-baseline/venv/bin/python" --archive "$archive" --output compatibility/results/probes
      - name: Dated compatibility result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result_file = Path('compatibility/results/probes/result.json')
          result = json.loads(result_file.read_text()) if result_file.exists() else {'result': 'UNVERIFIED: environment or setup failed'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"## Core {os.environ['HA_VERSION']} — {os.environ['JOB_STATUS']}\n\n")
              summary.write(datetime.now(timezone.utc).isoformat() + '\n\n')
              summary.write('Actual isolated HA with synthetic credentials and inert services; no household or security certification.\n\n')
              summary.write('```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ha-compatibility-${{ matrix.version }}
          path: compatibility/
          retention-days: 90
          if-no-files-found: error
